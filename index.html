<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K3YS Logo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a2e;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            max-width: 100%;
            max-height: 90vh;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="k3ys-logo.png" alt="K3YS Security Logo" class="logo">
    </div>

</body>
</html>
